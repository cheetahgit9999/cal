<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zzzanimelovers (สด)</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#e6edf3;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;padding:18px}.wrap{max-width:760px;margin:0 auto}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}h1{font-size:19px;margin:0;font-weight:650}.dot{width:9px;height:9px;border-radius:50%;background:#3fb950;animation:p 2s infinite}@keyframes p{0%{box-shadow:0 0 0 0 rgba(63,185,80,.45)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}.meta{color:#8b949e;font-size:12.5px;margin-bottom:16px}.meta b{color:#adbac7;font-weight:600}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#8b949e;margin:22px 0 8px;font-weight:600}.ev{display:flex;gap:12px;padding:10px 12px;border:1px solid #21262d;border-radius:10px;margin-bottom:8px;background:#151a21;transition:background .6s}.ev.now{border-color:#2f81f7;background:#132030}.t{min-width:86px;color:#2f81f7;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;flex-shrink:0}.b{flex:1;min-width:0}.ti{font-weight:600}.lo{color:#8b949e;font-size:12.5px}.de{color:#6e7681;font-size:12px;white-space:pre-wrap;margin-top:3px}.empty{color:#6e7681;padding:20px 0}.flash{animation:f 1.2s ease}@keyframes f{0%{background:#1c3d22}100%{background:#151a21}}.err{background:#3d1418;border:1px solid #7d2a30;color:#ffb3b8;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}</style></head><body><div class="wrap"><div class="top"><span class="dot"></span><h1>zzzanimelovers (สด)</h1></div><div class="meta">อัปเดตอัตโนมัติทุก 10 วิ · เช็คล่าสุด <b id="ts">—</b> · <b id="n">—</b> รายการ</div><div id="err"></div><div id="list" class="empty">กำลังโหลด…</div></div><script>var POLL=15000,TZ="Asia/Bangkok",API="https://script.google.com/macros/s/AKfycbz7tH4iscyXCdtJB4T8GL34Ppp9PuEuUIsw8MjQ-ii3_4Ie6DvusFw8PfhAZ8gjKEJA/exec?format=json&t=";function dayKey(d){var p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d).reduce(function(a,x){a[x.type]=x.value;return a},{});return p.year+"-"+p.month+"-"+p.day}function dayLabel(d){return new Intl.DateTimeFormat("th-TH",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"}).format(d)}function hm(d){return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(d)}function hms(d){return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d)}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]})}function render(data){var now=Date.now(),events=data.events||[],html="",cur="";document.getElementById("ts").textContent=hms(new Date());document.getElementById("n").textContent=data.count;if(!events.length){document.getElementById("list").innerHTML="<div class=empty>ไม่มีรายการในช่วงนี้</div>";return}for(var i=0;i<events.length;i++){var e=events[i],s=new Date(e.start),en=new Date(e.end);var k=dayKey(s);if(k!==cur){cur=k;html+="<h2>"+esc(dayLabel(s))+"</h2>";}var isNow=(now>=s.getTime()&&now<en.getTime());html+="<div class=\"ev"+(isNow?" now":"")+"\"><div class=t>"+(e.allDay?"ทั้งวัน":hm(s))+"</div><div class=b>"+"<div class=ti>"+esc(e.title)+"</div>"+(e.location?"<div class=lo>"+esc(e.location)+"</div>":"")+(e.description?"<div class=de>"+esc(e.description)+"</div>":"")+"</div></div>";}var el=document.getElementById("list");if(el.innerHTML!==html){el.innerHTML=html;el.className="";var f=el.querySelector(".ev");if(f)f.classList.add("flash")}}var busy=false;function ok(d){busy=false;document.getElementById("err").innerHTML="";render(d)}function bad(e){busy=false;document.getElementById("err").innerHTML="<div class=err>หลุดการเชื่อมต่อ: "+esc((e&&e.message)||e)+" — กำลังลองใหม่…</div>"}function tick(){if(busy)return;busy=true;fetch(API+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(ok).catch(bad)}tick();setInterval(tick,POLL);</script></body></html>
