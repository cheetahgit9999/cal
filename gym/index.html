<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0e1116;color:#e6edf3;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;padding:14px 14px 120px}
.wrap{max-width:640px;margin:0 auto}
input,button{font:inherit;color:inherit}
button{background:#21262d;border:1px solid #30363d;border-radius:10px;padding:6px 11px;cursor:pointer;touch-action:manipulation}
button:active{background:#30363d}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.bar .d{flex:1;text-align:center;font-weight:600;font-size:15px}
.bar .d.t{color:#3fb950}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.tabs button{padding:7px 0;font-size:12px;font-weight:600;letter-spacing:.02em}
.tabs button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.tabs button.td{box-shadow:inset 0 -2px 0 #3fb950}
.card{border:1px solid #21262d;border-radius:14px;background:#151a21;padding:10px 12px;margin-bottom:8px}
.card.all{border-color:#238636;background:#132118}
.card.cur{border-color:#2f81f7}
.nm{font-weight:650;margin-bottom:8px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 64px;gap:8px}
.stp{display:flex;border:1px solid #30363d;border-radius:10px;overflow:hidden;background:#0b0e13;height:44px}
.stp button{border:0;border-radius:0;background:#1b2028;padding:0 11px;font-size:18px;color:#adbac7}
.stp input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.stp input:focus{outline:none;background:#101722}
.stp.lo input{color:#f85149}.stp.hi input{color:#f0883e}
.card.all .stp{opacity:.6}
.ok{height:44px;padding:0;border-radius:10px;border:2px solid #30363d;background:none;color:#6e7681;font-weight:700;font-size:15px}
.ok.part{border-color:#2f81f7;color:#58a6ff}
.ok.on{background:#238636;border-color:#238636;color:#fff}
.hist{margin-top:8px;font-size:12.5px;color:#8b949e;font-variant-numeric:tabular-nums}
.hist div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1b2028}
.ph{text-align:center;font-size:26px;font-weight:800;letter-spacing:.04em;margin:6px 0 14px;line-height:1.2}
.ph.dim{color:#6e7681;margin-top:40px}
.foot{margin-top:20px;display:flex;gap:8px;justify-content:center}
.foot button{color:#8b949e}
#cfg{display:none;margin-top:10px;border:1px solid #21262d;border-radius:12px;padding:10px;font-size:13px;color:#8b949e}
#cfg.on{display:block}
#cfg .r{display:flex;gap:6px;align-items:center;margin:6px 0}
#cfg input[type=text]{flex:1;min-width:0;background:#0b0e13;border:1px solid #30363d;border-radius:8px;padding:5px 7px}
#cfg input[type=checkbox]{width:20px;height:20px;accent-color:#238636}
#timer{position:fixed;left:0;right:0;bottom:0;background:#161b22;border-top:1px solid #30363d;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;z-index:9}
#timer.on{display:block}
#timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#timer .clk{font-size:34px;font-weight:750;font-variant-numeric:tabular-nums;color:#d29922;min-width:92px}
#timer.ready .clk{color:#3fb950}
#timer .tx{flex:1;min-width:0;font-size:13.5px;color:#adbac7}
#timer .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .pb{height:4px;background:#30363d;border-radius:2px;margin-top:6px;overflow:hidden}
#timer .pb i{display:block;height:100%;background:#d29922;width:0}
#timer.ready .pb i{background:#3fb950}
#pop{position:fixed;inset:0;z-index:20;background:rgba(1,4,9,.9);display:none;align-items:center;justify-content:center;padding:20px}
#pop.on{display:flex}
#pop .bx{width:100%;max-width:400px;background:#0f2a17;border:2px solid #3fb950;border-radius:22px;padding:26px 20px 20px;text-align:center}
#pop .big{font-size:84px;font-weight:800;color:#3fb950;line-height:1;font-variant-numeric:tabular-nums}
#pop .nx{color:#e6edf3;font-size:16px;font-weight:600;margin:16px 0 18px}
#pop button{display:block;width:100%;padding:15px;font-size:19px;font-weight:700;border-radius:14px;margin-top:10px}
#pop .go{background:#238636;border-color:#238636;color:#fff}
#pop .more{background:none;color:#adbac7}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="prev">‹</button>
    <div class="d" id="dlabel"></div>
    <button id="next">›</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <div class="foot">
    <button id="exp">Export</button>
    <button id="imp">Import</button>
    <button id="cfgBtn">⚙</button>
    <input type="file" id="impFile" accept=".md,.json,.txt,text/plain,application/json" hidden>
  </div>
  <div id="cfg">
    <div class="r"><input type="checkbox" id="pushOn"> ntfy <input type="text" id="pushTopic" readonly><button id="pushCopy">copy</button><button id="pushTest">test</button></div>
    <div class="r"><input type="checkbox" id="iosOn"> Shortcuts <input type="text" id="iosName"><button id="iosTest">test</button></div>
  </div>
</div>

<div id="timer"><div class="in">
  <div class="clk" id="clk">0:00</div>
  <div class="tx"><div id="tnext"></div><div class="pb"><i id="tpb"></i></div></div>
  <button id="tstop">✕</button>
</div></div>

<div id="pop"><div class="bx">
  <div class="big" id="pclk">3:00</div>
  <div class="nx" id="pnext"></div>
  <button class="go" id="pgo">💪 เล่นต่อ</button>
  <button class="more" id="prest">พักต่อ</button>
</div></div>

<script>
// ===== PROGRAM — names and order exactly as written; do not edit =====
// t = name, s = sets, w/r = starting weight/reps before any history
var PROGRAM = {
  MON: { label: "MONDAY (REST)", rest: true },
  TUE: { label: "TUESDAY (UPPER)", ex: [
    { t: "1. Machine Pec Ty Deck x2", s: 2, w: "50", r: "" },
    { t: "2. Incline Chest Press x2", s: 2, w: "50", r: "" },
    { t: "3. Lateral Raise x2", s: 2, w: "50", r: "7" },
    { t: "4. T-Bar Row x1", s: 1, w: "40", r: "5" },
    { t: "5. Lat Pulldown x1", s: 1, w: "35", r: "" },
    { t: "6. Standing cable Curl x1 (rest 2-3min)", s: 1, w: "13.75", r: "7" },
    { t: "7. 🔺Cable Tricep Extension x1 (rest 2-3min)", s: 1, w: "11.25", r: "7" },
    { t: "8. Cable Hammer Curl x1 (rest 2-3min)", s: 1, w: "13.6", r: "" },
    { t: "9. 🔺Cable Overhead Tricep Extension x1 (rest 2-3 min)", s: 1, w: "13.75", r: "" }
  ]},
  WED: { label: "WEDNESDAY (LOWER)", ex: [
    { t: "1. Leg Extension x2", s: 2, w: "90", r: "6" },
    { t: "2. Hack squat x2", s: 2, w: "10", r: "6" },
    { t: "3. Hamstring Curl x2", s: 2, w: "50", r: "7" },
    { t: "4. SLDL x2", s: 2, w: "27.5", r: "8" },
    { t: "6. Abs Crunch x2", s: 2, w: "90", r: "5" }
  ]},
  THU: { label: "THURSDAY (REST)", rest: true },
  FRI: { label: "FRIDAY (PUSH)", ex: [
    { t: "3. Machine Pec Deck x2", s: 2, w: "30+15", r: "9" },
    { t: "4. Incline Chest Press x2", s: 2, w: "50+15", r: "5" },
    { t: "5. Shoulder Press x1", s: 1, w: "50", r: "4" },
    { t: "6. Lateral Raise x2", s: 2, w: "50", r: "7" },
    { t: "7. Cable Tricep Extension x1 (2 min)", s: 1, w: "13.75", r: "" },
    { t: "9. Cable Overhead Tricep Extension x1", s: 1, w: "11.25", r: "7" },
    { t: "1. Standing Calf Raise x2", s: 2, w: "70", r: "10" },
    { t: "2. Adductor x1", s: 1, w: "50+15", r: "7" }
  ]},
  SAT: { label: "SATURDAY (PULL)", ex: [
    { t: "1. T-Bar Row x2", s: 2, w: "37.5", r: "8" },
    { t: "2. Lat Pulldown x2", s: 2, w: "35", r: "9" },
    { t: "3. Close-Grip Lat Row x2", s: 2, w: "25", r: "5" },
    { t: "4. Rear delt ยืน x1", s: 1, w: "8.75", r: "8" },
    { t: "5. Standing cable Curl x2", s: 2, w: "13.75", r: "7" },
    { t: "Cable Hammer Curl x1 (2 min)", s: 1, w: "13.6", r: "" },
    { t: "7. Abs Crunch x2", s: 2, w: "70+15", r: "5" }
  ]},
  SUN: { label: "SUNDAY (CARDIO)", cardio: "1 hour" }
};
var ORDER = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
var SHORT = { MON: "MON", TUE: "TUE", WED: "WED", THU: "THU", FRI: "FRI", SAT: "SAT", SUN: "SUN" };
var REP_MIN = 5, REP_MAX = 10, REP_BUMP = 11, REST_GOAL = 180;

// ===== storage =====
// log[date] = { prog: "TUE", ex: { "<name>": { w: "50", r: "9", d: 1 } }, cardio: bool }
// d = sets ticked; one weight/reps per exercise
var KEY = "gym.v2";
function migrate(d) {
  Object.keys(d.log || {}).forEach(function (k) {
    var ex = d.log[k].ex || {};
    Object.keys(ex).forEach(function (n) {
      var v = ex[n];
      if (Array.isArray(v)) {
        var f = v.filter(function (s) { return s && s.r !== "" && s.r != null; })[0] || v[0] || {};
        ex[n] = { w: f.w || "", r: f.r == null ? "" : String(f.r), d: v.filter(function (s) { return s && s.done; }).length };
      }
    });
  });
  return d;
}
function load() {
  try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.log) return migrate(d); } catch (e) {}
  return { log: {} };
}
var db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { alert(e.message); } }

// ===== dates (Bangkok) =====
var TZ = "Asia/Bangkok";
function dayKey(d) {
  var p = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(d).reduce(function (a, x) { a[x.type] = x.value; return a; }, {});
  return p.year + "-" + p.month + "-" + p.day;
}
function kDate(k) { return new Date(k + "T12:00:00+07:00"); }
function shift(k, n) { return dayKey(new Date(kDate(k).getTime() + n * 86400000)); }
function weekdayOf(k) { return ORDER[(kDate(k).getUTCDay() + 6) % 7]; }
function dLabel(k) { return new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" }).format(kDate(k)); }
var TODAY = dayKey(new Date()), cur = TODAY;
function progOf(k) { return (db.log[k] && db.log[k].prog) || weekdayOf(k); }

// ===== weights ("50+15" = 65) =====
function wSum(w) { return String(w || "").split("+").reduce(function (a, x) { var n = parseFloat(x); return a + (isFinite(n) ? n : 0); }, 0); }
function fmt(n) { return String(Math.round(n * 100) / 100); }
function stepFor(w) { return wSum(w) >= 20 ? 2.5 : 1.25; }
function bumpW(w, dir) {
  var s = String(w || "0"), m = s.match(/^\s*(\d+(?:\.\d+)?)(.*)$/);
  if (!m) return s;
  return fmt(Math.max(0, parseFloat(m[1]) + dir * stepFor(s))) + m[2];
}
function hasReps(e) { return e && e.r !== "" && e.r != null; }

// ===== history =====
function lastFor(prog, name, before) {
  var days = Object.keys(db.log).filter(function (d) { return d < before && db.log[d].prog === prog; }).sort().reverse();
  for (var i = 0; i < days.length; i++) {
    var e = db.log[days[i]].ex && db.log[days[i]].ex[name];
    if (hasReps(e)) return { day: days[i], e: e };
  }
  return null;
}
function entryFor(prog, item, k) {
  var L = db.log[k];
  if (L && L.prog === prog && L.ex && L.ex[item.t]) return L.ex[item.t];
  var last = lastFor(prog, item.t, k);
  return { w: last ? last.e.w : item.w, r: last ? String(last.e.r) : item.r, d: 0 };
}
function persist(prog, item, e) {
  if (!db.log[cur]) db.log[cur] = { prog: prog, ex: {} };
  db.log[cur].prog = prog;
  db.log[cur].ex = db.log[cur].ex || {};
  db.log[cur].ex[item.t] = e;
  save();
}

// ===== render =====
var openHist = {}, nextUp = null;
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  var prog = progOf(cur), P = PROGRAM[prog];
  var dl = document.getElementById("dlabel");
  dl.textContent = dLabel(cur); dl.className = "d" + (cur === TODAY ? " t" : "");
  var tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  ORDER.forEach(function (d) {
    var b = el("button", (d === prog ? "on" : "") + (d === weekdayOf(cur) ? " td" : ""), SHORT[d]);
    b.onclick = function () { switchProg(d); };
    tabs.appendChild(b);
  });
  var list = document.getElementById("list"); list.innerHTML = "";
  nextUp = findNext();
  list.appendChild(el("div", "ph" + (P.rest ? " dim" : ""), P.label));
  if (P.rest) { updateTimer(); return; }
  if (P.cardio) {
    var c = el("div", "card"), done = !!(db.log[cur] && db.log[cur].cardio);
    c.style.display = "flex"; c.style.justifyContent = "space-between"; c.style.alignItems = "center";
    c.appendChild(el("div", "nm", P.cardio));
    var b = el("button", "ok" + (done ? " on" : ""), "✓"); b.style.width = "64px";
    b.onclick = function () { if (!db.log[cur]) db.log[cur] = { prog: prog, ex: {} }; db.log[cur].cardio = !done; save(); render(); };
    c.appendChild(b); if (done) c.classList.add("all");
    list.appendChild(c); updateTimer(); return;
  }
  P.ex.forEach(function (item) { list.appendChild(card(prog, item)); });
  updateTimer();
}

function card(prog, item) {
  var e = entryFor(prog, item, cur);
  var c = el("div", "card" + (e.d >= item.s ? " all" : nextUp && nextUp.t === item.t ? " cur" : ""));
  var nm = el("div", "nm", item.t);
  nm.onclick = function () { openHist[item.t] = !openHist[item.t]; render(); };
  c.appendChild(nm);

  var row = el("div", "row");
  row.appendChild(stepper("w", "decimal", function (dir) { e.w = bumpW(e.w, dir); }));
  row.appendChild(stepper("r", "numeric", function (dir) { e.r = String(Math.max(0, (parseInt(e.r, 10) || 0) + dir)); }));
  var ok = el("button", "ok" + (e.d >= item.s ? " on" : e.d ? " part" : ""), item.s > 1 ? "✓ " + e.d + "/" + item.s : "✓");
  ok.onclick = function () {
    var was = e.d;
    e.d = e.d >= item.s ? 0 : e.d + 1; // one tap per set; tap again when full to clear
    persist(prog, item, e);
    if (e.d > was) startRest(item.t); else if (timer && timer.ex === item.t) stopRest();
    render();
    if (e.d > was) alertPhone();
  };
  row.appendChild(ok);
  c.appendChild(row);

  if (openHist[item.t]) {
    var h = el("div", "hist");
    Object.keys(db.log).filter(function (d) { return db.log[d].prog === prog && db.log[d].ex && hasReps(db.log[d].ex[item.t]); })
      .sort().reverse().slice(0, 30).forEach(function (d) {
        var x = db.log[d].ex[item.t], r = el("div");
        r.appendChild(el("span", null, dLabel(d))); r.appendChild(el("span", null, x.w + " × " + x.r)); h.appendChild(r);
      });
    c.appendChild(h);
  }
  return c;

  function stepper(f, mode, step) {
    var cls = "stp";
    if (f === "r" && hasReps(e)) cls += +e.r >= REP_BUMP ? " hi" : +e.r < REP_MIN ? " lo" : "";
    var box = el("div", cls), minus = el("button", null, "−"), plus = el("button", null, "+"), inp = el("input");
    inp.value = e[f]; inp.inputMode = mode; inp.placeholder = f === "w" ? "kg" : "reps";
    inp.oninput = function () { e[f] = inp.value.trim(); persist(prog, item, e); };
    inp.onchange = render;
    minus.onclick = function () { step(-1); persist(prog, item, e); render(); };
    plus.onclick = function () { step(1); persist(prog, item, e); render(); };
    box.appendChild(minus); box.appendChild(inp); box.appendChild(plus);
    return box;
  }
}

function switchProg(d) {
  if (d === progOf(cur)) return;
  var L = db.log[cur];
  if (L && ((L.ex && Object.keys(L.ex).length) || L.cardio) && !confirm(PROGRAM[L.prog].label + " → " + PROGRAM[d].label + "?")) return;
  if (d === weekdayOf(cur)) delete db.log[cur]; else db.log[cur] = { prog: d, ex: {} };
  save(); render();
}

// next = same machine if sets remain, else first unfinished in order
function findNext() {
  var prog = progOf(cur), P = PROGRAM[prog];
  if (!P.ex) return null;
  var left = P.ex.filter(function (it) { return entryFor(prog, it, cur).d < it.s; });
  if (!left.length) return null;
  var same = timer && left.filter(function (it) { return it.t === timer.ex; })[0];
  var it = same || left[0], e = entryFor(prog, it, cur);
  return { t: it.t, set: e.d + 1, s: it.s };
}
function nextText() { return nextUp ? nextUp.t + (nextUp.s > 1 ? " · " + nextUp.set + "/" + nextUp.s : "") : "✓"; }

// ===== rest timer: counts up from 0:00, never stops by itself =====
var TKEY = "gym.timer", timer = null, audio = null, lock = null;
try { timer = JSON.parse(localStorage.getItem(TKEY)); } catch (e) {}
function saveTimer() { try { timer ? localStorage.setItem(TKEY, JSON.stringify(timer)) : localStorage.removeItem(TKEY); } catch (e) {} }
function startRest(ex) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  if (timer) cancelNags(timer);
  timer = { ex: ex, start: Date.now(), popped: false, seq: "r" + Date.now().toString(36), sent: 0 };
  saveTimer(); closePop(); wake(true);
}
function stopRest() { if (timer) cancelNags(timer); timer = null; saveTimer(); closePop(); wake(false); updateTimer(); }
function wake(on) {
  try {
    if (on && !lock && navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () {});
    if (!on && lock) { lock.release(); lock = null; }
  } catch (e) {}
}
function clock(sec) { var m = Math.floor(sec / 60), x = sec % 60; return m + ":" + (x < 10 ? "0" : "") + x; }
function beep() {
  try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 800]); } catch (e) {}
  if (!audio) return;
  try {
    [0, 0.3, 0.6, 1.2, 1.5, 1.8].forEach(function (t) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = "square"; o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.2);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });
  } catch (e) {}
}
function openPop() { document.getElementById("pnext").textContent = nextText(); document.getElementById("pop").className = "on"; }
function closePop() { document.getElementById("pop").className = ""; }
function updateTimer() {
  var box = document.getElementById("timer");
  if (!timer) { box.className = ""; return; }
  var sec = Math.max(0, Math.floor((Date.now() - timer.start) / 1000)), ready = sec >= REST_GOAL;
  if (ready && !timer.popped && document.visibilityState !== "hidden") {
    timer.popped = true; saveTimer();
    if (sec < REST_GOAL + 5) beep();
    openPop();
  }
  box.className = "on" + (ready ? " ready" : "");
  document.getElementById("clk").textContent = clock(sec);
  document.getElementById("pclk").textContent = clock(sec);
  document.getElementById("tnext").textContent = nextText();
  document.getElementById("tpb").style.width = Math.min(100, sec / REST_GOAL * 100) + "%";
  topUpNags();
}
setInterval(updateTimer, 250);
document.addEventListener("visibilitychange", function () { updateTimer(); if (timer && document.visibilityState === "visible") wake(true); });
if (timer) wake(true);

// ===== phone alerts (settings behind ⚙) =====
var NKEY = "gym.push", push = { on: false, topic: "" };
try { var _n = JSON.parse(localStorage.getItem(NKEY)); if (_n) push = _n; } catch (e) {}
if (!push.topic) {
  var rnd = new Uint8Array(8); crypto.getRandomValues(rnd);
  push.topic = "gymrest-" + Array.prototype.map.call(rnd, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
}
var IKEY = "gym.ios", ios = { on: false, name: "Gym Rest" };
try { var _i = JSON.parse(localStorage.getItem(IKEY)); if (_i) ios = _i; } catch (e) {}
function saveCfg() { try { localStorage.setItem(NKEY, JSON.stringify(push)); localStorage.setItem(IKEY, JSON.stringify(ios)); } catch (e) {} }
saveCfg();
function sendPush() {
  return fetch("https://ntfy.sh/" + push.topic + "?title=" + encodeURIComponent("test ✓"), { method: "POST", body: "ok" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return true; })
    .catch(function (e) { alert(e.message); return false; });
}

// Rest reminders: at 3:00, then every 15 s until the next ✓.
// The page can't run while iOS has it in the background, so reminders are scheduled ahead on ntfy.sh
// (one sequence ID each) and the ones not yet delivered are cancelled on the next ✓ / ✕.
// NAG_BATCH per ✓ keeps within ntfy.sh's free rate limits; while the page is open it keeps adding more.
var NAG_EVERY = 15, NAG_BATCH = 8, NAG_MAX = 60, nagBusy = false;
function nagDue(t, i) { return t.start + (REST_GOAL + NAG_EVERY * i) * 1000; }
function scheduleNags(t, from, count) {
  if (!push.on || !t) return Promise.resolve();
  var click = /^https?:/.test(location.href) ? "&click=" + encodeURIComponent(location.href.split("#")[0]) : "";
  var jobs = [];
  for (var i = from; i < Math.min(from + count, NAG_MAX); i++) {
    var title = (i === 0 ? "3:00 ✓" : "⏰ " + clock(REST_GOAL + NAG_EVERY * i));
    var q = "title=" + encodeURIComponent(title) + "&priority=high&tags=muscle&delay=" + Math.floor(nagDue(t, i) / 1000) + click;
    jobs.push(fetch("https://ntfy.sh/" + push.topic + "/" + t.seq + "-" + i + "?" + q, { method: "POST", keepalive: true, body: nextText() }).catch(function () {}));
  }
  t.sent = Math.max(t.sent || 0, Math.min(from + count, NAG_MAX));
  saveTimer();
  return Promise.all(jobs);
}
function cancelNags(t) {
  if (!t || !t.seq || !t.sent) return;
  var now = Date.now();
  for (var i = 0; i < t.sent; i++) {
    if (nagDue(t, i) > now - 2000) fetch("https://ntfy.sh/" + push.topic + "/" + t.seq + "-" + i, { method: "DELETE", keepalive: true }).catch(function () {});
  }
  t.sent = 0;
}
// page open on screen: keep the chain going so it never runs out
function topUpNags() {
  if (!push.on || !timer || !timer.seq || nagBusy || document.visibilityState === "hidden") return;
  if (!timer.sent || timer.sent >= NAG_MAX) return;
  if (nagDue(timer, timer.sent - 1) - Date.now() > 60000) return;
  nagBusy = true;
  scheduleNags(timer, timer.sent, 4).then(function () { nagBusy = false; });
}
function runShortcut() {
  var url = "shortcuts://x-callback-url/run-shortcut?name=" + encodeURIComponent(ios.name || "Gym Rest");
  if (!navigator.standalone) url += "&x-success=" + encodeURIComponent(location.href.split("#")[0]);
  location.href = url;
}
// ntfy first: leaving for Shortcuts right away could cancel the request
function alertPhone() {
  var sent = scheduleNags(timer, 0, NAG_BATCH);
  if (ios.on) Promise.race([sent, new Promise(function (ok) { setTimeout(ok, 2500); })]).then(runShortcut);
}

// ===== export: Markdown an AI can read, with the raw data embedded for Import =====
function exportText() {
  var days = Object.keys(db.log).sort(), out = [];
  out.push("# Gym log — progressive overload");
  out.push("");
  out.push("- Exported: " + TODAY + " (Asia/Bangkok)");
  out.push("- Rule: rep range " + REP_MIN + "–" + REP_MAX + ". Reaching " + REP_BUMP + "+ reps means increase the weight next session.");
  out.push("- Weight is in kg. \"50+15\" means 50 + 15 = 65 kg total. Weight and reps are logged once per exercise; \"Sets done\" is how many sets were ticked.");
  out.push("- Est. 1RM uses the Epley formula: total kg × (1 + reps / 30).");
  ORDER.forEach(function (p) {
    var P = PROGRAM[p];
    if (P.rest) return;
    var pd = days.filter(function (d) { return db.log[d].prog === p; });
    out.push(""); out.push("## " + P.label);
    if (P.cardio) {
      out.push(""); out.push("- " + P.cardio + ": " + (pd.filter(function (d) { return db.log[d].cardio; }).join(", ") || "no sessions logged"));
      return;
    }
    P.ex.forEach(function (it) {
      var rows = pd.filter(function (d) { return hasReps(db.log[d].ex && db.log[d].ex[it.t]); });
      out.push(""); out.push("### " + it.t);
      if (!rows.length) { out.push(""); out.push("No sessions logged."); return; }
      out.push(""); out.push("| Date | Weight (kg) | Total kg | Reps | Sets done | Est. 1RM | vs previous |");
      out.push("|---|---|---|---|---|---|---|");
      var prev = null;
      rows.forEach(function (d) {
        var x = db.log[d].ex[it.t], tw = wSum(x.w), r = +x.r, one = tw * (1 + r / 30), ch = "first";
        if (prev) {
          var dw = tw - prev.tw, dr = r - prev.r;
          ch = dw > 0 ? "weight +" + fmt(dw) : dw < 0 ? "weight " + fmt(dw) : dr > 0 ? "reps +" + dr : dr < 0 ? "reps " + dr : "same";
        }
        if (r >= REP_BUMP) ch += "; " + REP_BUMP + "+ reps → increase weight";
        out.push("| " + d + " | " + x.w + " | " + fmt(tw) + " | " + r + " | " + (x.d || 0) + "/" + it.s + " | " + fmt(one) + " | " + ch + " |");
        prev = { tw: tw, r: r };
      });
    });
  });
  out.push(""); out.push("## Raw data (used by Import)"); out.push("");
  out.push("```json"); out.push(JSON.stringify(db)); out.push("```"); out.push("");
  return out.join("\n");
}
document.getElementById("exp").onclick = function () {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([exportText()], { type: "text/markdown;charset=utf-8" }));
  a.download = "gym-log-" + TODAY + ".md"; document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("imp").onclick = function () { document.getElementById("impFile").click(); };
document.getElementById("impFile").onchange = function (ev) {
  var f = ev.target.files[0]; if (!f) return;
  f.text().then(function (t) {
    var m = t.match(/```json\s*([\s\S]*?)```/), d = JSON.parse(m ? m[1] : t);
    if (!d || !d.log) throw new Error("invalid file");
    if (confirm("Import?")) { db = migrate(d); save(); render(); }
  }).catch(function (err) { alert(err.message); });
  ev.target.value = "";
};

document.getElementById("prev").onclick = function () { cur = shift(cur, -1); render(); };
document.getElementById("next").onclick = function () { cur = shift(cur, 1); render(); };
document.getElementById("dlabel").onclick = function () { cur = TODAY; render(); };
document.getElementById("tstop").onclick = stopRest;
document.getElementById("prest").onclick = closePop;
document.getElementById("pgo").onclick = function () {

  var c = document.querySelector(".card.cur"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" });

var pushOn = document.getElementById("pushOn"), pushTopic = document.getElementById("pushTopic");
var iosOn = document.getElementById("iosOn"), iosName = document.getElementById("iosName");
pushOn.checked = !!push.on; pushTopic.value = push.topic; iosOn.checked = !!ios.on; iosName.value = ios.name || "Gym Rest";
pushOn.onchange = function () { push.on = pushOn.checked; saveCfg(); };
iosOn.onchange = function () { ios.on = iosOn.checked; saveCfg(); };
iosName.oninput = function () { ios.name = iosName.value.trim(); saveCfg(); };
document.getElementById("pushCopy").onclick = function () {
  pushTopic.select();
  (navigator.clipboard ? navigator.clipboard.writeText(push.topic) : Promise.reject()).catch(function () { document.execCommand("copy"); });
};
document.getElementById("pushTest").onclick = function () { sendPush(); };
document.getElementById("iosTest").onclick = runShortcut;
render();
</script>
